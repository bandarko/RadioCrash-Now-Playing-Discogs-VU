# Radio Crash VU: include this file inside the live.radiocrash.net server block.

location = /vu/events {
    if ($request_method = OPTIONS) {
        return 204;
    }

    add_header Access-Control-Allow-Origin  $cors_allow always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Last-Event-ID" always;
    add_header Cache-Control "no-store" always;
    add_header X-Accel-Buffering "no" always;
    add_header Vary "Origin" always;

    proxy_pass http://127.0.0.1:8767/events;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 30s;
}

location = /vu/status {
    if ($request_method = OPTIONS) {
        return 204;
    }

    add_header Access-Control-Allow-Origin  $cors_allow always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
    add_header Cache-Control "no-store" always;
    add_header Vary "Origin" always;

    proxy_pass http://127.0.0.1:8767/health;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 5s;
}
